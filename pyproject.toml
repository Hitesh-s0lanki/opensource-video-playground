[project]
name = "vidgen"
version = "0.1.0"
description = "Local open-source video generation studio (text-to-video + image-to-video) tuned for low-VRAM consumer GPUs"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- torch stack (pulled from the CUDA wheel index, see [tool.uv.sources]) ---
    "torch==2.6.0",
    "torchvision==0.21.0",
    # --- diffusion stack ---
    "diffusers>=0.33.1",
    "transformers>=4.49.0",
    "accelerate>=1.4.0",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.30.0",
    "peft>=0.14.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.3",
    "ftfy>=6.2.0",
    "einops>=0.8.0",
    # --- media io ---
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.5.1",
    "pillow>=10.4.0",
    "numpy>=1.26,<3",
    # --- app ---
    "streamlit>=1.40.0",
    # Streamlit's own bound is `starlette<2`, loose enough to allow a major
    # version jump. Starlette 1.x made `thread_minimum_size` required on
    # GZipResponder; Streamlit's gzip middleware subclasses it without passing
    # that argument, so every gzip-accepting request (every browser) 500s in
    # middleware. Keep starlette on 0.x until Streamlit supports 1.x.
    "starlette>=0.46,<1.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Optional: 4/8-bit transformer quantization. Shrinks the bigger backends enough
# to matter on <=6 GB cards, but adds a fragile native dependency on Windows.
quant = [
    "bitsandbytes>=0.45.0",
    "optimum-quanto>=0.2.6",
]

[project.scripts]
vidgen = "vidgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidgen"]

# torch/torchvision must come from PyTorch's CUDA index, not PyPI (PyPI ships the
# CPU-only build on Windows). Everything else resolves from PyPI as normal.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
